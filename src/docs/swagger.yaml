tags:
  - name: Orders
    description: Gestión de pedidos
  - name: Users
    description: Gestión de usuarios
  - name: Mocks
    description: Generación de mocks
  - name: Deliveries
    description: Gestión de entregas
  - name: Stores
    description: Gestión de comercios
  - name: Logger
    description: Test del logger

paths:
  /api/mocks/users:
    get:
      tags: [Mocks]
      summary: Listar datos de prueba de usuarios
      description: Devuelve datos de usuarios ficticios
      parameters:
        - in: query
          name: qty
          required: false
          description: Cantidad de entidades a generar
          schema:
            type: integer
            example: 5
      responses:
        "200":
          description: Mock de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersMockResponse"
        "400":
          description: El parametro qty debe ser mayor a 0 y no puede superar un valor máximo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                InvalidMockQuantity:
                  summary:
                  value:
                    status: error
                    message: qty debe ser un número entero mayor a 0
                    code: INVALID_MOCK_QUANTITY
                InvalidMockQuantityMax:
                  summary:
                  value:
                    status: error
                    message: qty no puede superar 500
                    code: INVALID_MOCK_QUANTITY_MAX

