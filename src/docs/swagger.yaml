components:
  schemas:
    OrderItem:
      type: object
      properties:
        name:
          type: string
          example: Paquete grande
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 1
          example: 2
        price:
          type: number
          example: 21.1
      required: [name, quantity, price]
    Customer:
      type: object
      properties:
        _id:
          type: string
          example: 6acc72a7d438e02332a08fd7
        firstName:
          type: string
          example: Juan
        lastName:
          type: string
          example: Perez
        email:
          type: string
          example: alguien@gmail.com
